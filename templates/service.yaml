apiVersion: v1
kind: Service
metadata:
  name: nginx
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: deployment
spec:
  type: {{ .Values.service.type }}
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
      purpose: deployment
  ports: 
    - protocol: TCP
      port: 80  # service port
      targetPort: 80  # container port
    
